baseURL = "https://praxis-weiterkommen.ch/"
# baseURL = "https://ganymede42.github.io/praxis-weiterkommen/"

title = "Praxis Weiterkommen"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
languageCode = "de-CH"

enableRobotsTXT = true

theme = "ananke"

[params]
site_logo = "Logo1_640px.png"
author = "Monika Kast Perry"
description = "Psychotherapie und psychologische Beratung in Birr AG für Kinder, Jugendliche, Familien und Erwachsene. Elternberatung, Familientherapie und Coaching für Lehrpersonen."
[params.ananke]
custom_css = ["css/custom.css"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
